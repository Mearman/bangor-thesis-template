name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-semantic-release-v1
      - uses: Mearman/actions/.github/actions/setup-texlive@setup-texlive-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install release plugins
        run: npm install --no-save --no-package-lock @semantic-release/changelog@6 @semantic-release/exec@7 @semantic-release/git@10
      - name: Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx --yes semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
