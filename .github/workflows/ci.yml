name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Mearman/actions/.github/actions/commitlint@v1

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache LaTeX build state
        uses: actions/cache@v4
        with:
          path: |
            *.aux
            *.fdb_latexmk
            *.fls
            *.bcf
            *.bbl
          key: latex-build-${{ hashFiles('**/*.tex', 'vendor/*') }}
          restore-keys: |
            latex-build-
      - uses: Mearman/actions/.github/actions/setup-texlive@v1
      - name: Compile
        run: |
          latexmk -pdf -interaction=nonstopmode main.tex
          ! grep -E "^!" main.log
          ! grep -E "Reference .* undefined|Citation .* undefined|multiply defined" main.log
      - name: Assert compile fits the Overleaf free-tier timeout
        run: |
          start=$(date +%s)
          latexmk -pdf -g -interaction=nonstopmode main.tex >/dev/null 2>&1
          elapsed=$(($(date +%s) - start))
          echo "cold recompile took ${elapsed}s"
          [ "$elapsed" -lt 15 ]
