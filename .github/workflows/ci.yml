name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Mearman/actions/.github/actions/commitlint@commitlint-v1


  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          curl -sL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint workflows
        run: ./actionlint -color
      - name: Lint workflow YAML
        run: yamllint .github/workflows/
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache LaTeX build state
        uses: actions/cache@v4
        with:
          path: |
            *.aux
            *.fdb_latexmk
            *.fls
            *.bcf
            *.bbl
          key: latex-build-${{ hashFiles('**/*.tex', 'vendor/*') }}
          restore-keys: |
            latex-build-
      - uses: Mearman/actions/.github/actions/setup-texlive@setup-texlive-v1
      - name: Compile
        run: |
          latexmk -pdf -interaction=nonstopmode main.tex
          if grep -E "^!" main.log; then
            echo "assertion failed: main.log matches"
            exit 1
          fi
          if grep -E "Reference .* undefined|Citation .* undefined|multiply defined" main.log; then
            echo "assertion failed: main.log matches"
            exit 1
          fi
      - name: Assert compile fits the Overleaf free-tier timeout
        run: |
          start=$(date +%s)
          latexmk -pdf -g -interaction=nonstopmode main.tex >/dev/null 2>&1
          elapsed=$(($(date +%s) - start))
          echo "cold recompile took ${elapsed}s"
          [ "$elapsed" -lt 15 ]
