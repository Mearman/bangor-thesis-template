name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-texlive-v1
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-semantic-release-v1
      - name: Install TeX Live packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-bibtex-extra texlive-extra-utils biber latexmk
      - name: Fetch l3build from CTAN
        run: |
          curl -sL -o l3build.zip https://mirror.apps.cam.ac.uk/pub/tex-archive/macros/latex/contrib/l3build.zip
          unzip -q l3build.zip
          mkdir -p "$HOME/texmf/scripts/l3build"
          cp l3build/*.lua "$HOME/texmf/scripts/l3build/"
          mktexlsr "$HOME/texmf"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install release plugins
        run: >-
          npm install --no-save --no-package-lock
          @semantic-release/changelog@6 @semantic-release/exec@7
          @semantic-release/git@10
      - name: Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx --yes semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
