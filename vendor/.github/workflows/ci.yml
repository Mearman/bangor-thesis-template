name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Mearman/actions/.github/actions/commitlint@commitlint-v1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Mearman/actions/.github/actions/setup-texlive@setup-texlive-v1
        with:
          profile: lint
      - name: Format check
        run: |
          status=0
          for f in *.sty *.cls doc/*.tex tests/smoke/*.tex; do
            latexindent -check -l .latexindent.yaml -s "$f" || status=1
          done
          exit $status
      - name: Lint
        run: |
          status=0
          for f in *.sty *.cls doc/*.tex; do
            chktex -q "$f" 2>&1 | tee "/tmp/chktex-$f.log" || true
            grep -q "Error" "/tmp/chktex-$f.log" && status=1
          done
          exit $status
      - name: Install actionlint and shellcheck
        run: |
          sudo apt-get install -y shellcheck
          curl -sL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint workflows
        run: ./actionlint -color
      - name: Lint workflow YAML
        run: yamllint .github/workflows/
      - name: README link check
        run: |
          status=0
          grep -oE 'https://[^)\]]+' README.md | sort -u | while IFS= read -r url; do
            case "$url" in
              *img.shields.io*|*ctan.org*|*latex-project.org*) continue ;;
            esac
            if ! curl -sf -o /dev/null --max-time 15 "$url"; then
              echo "broken link: $url"
              status=1
            fi
          done
          exit ${status:-0}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-texlive-v1
      - name: Cache LaTeX build state
        uses: actions/cache@v4
        with:
          path: |
            *.aux
            *.fdb_latexmk
            *.fls
            *.bcf
            *.bbl
          key: latex-build-${{ hashFiles('**/*.tex', '**/*.sty', '**/*.cls', 'tests/smoke/*.bib') }}
          restore-keys: |
            latex-build-
      - uses: Mearman/actions/.github/actions/setup-texlive@setup-texlive-v1
        with:
          extra: texlive-lang-european poppler-utils
      - name: Compile documentation
        run: |
          latexmk -pdf -interaction=nonstopmode doc/bangor.tex
          if grep -E "^!" bangor.log; then
            echo "assertion failed: bangor.log matches"
            exit 1
          fi
          stamp=$(pdfinfo bangor.pdf | grep Subject | grep -oE 'bangor [0-9/]+ v[0-9]+' | head -1)
          if [ -z "$stamp" ]; then
            echo "version stamp missing from the PDF metadata"
            exit 1
          fi
          echo "PDF stamp: $stamp"
          if grep -E "Reference .* undefined|Citation .* undefined|multiply defined" bangor.log; then
            echo "assertion failed: bangor.log matches"
            exit 1
          fi
      - name: Compile positive smoke tests
        run: |
          status=0
          for f in research-thesis taught-dissertation letter declarations-article; do
            latexmk -pdf -interaction=nonstopmode "tests/smoke/$f.tex" || status=1
            log="tests/smoke/$f.log"
            grep -E "^!" "$log" && status=1
            grep -E "Reference .* undefined|Citation .* undefined|multiply defined" "$log" && status=1
          done
          exit $status
      - name: Assert strict-mode failure
        run: |
          if latexmk -pdf -interaction=nonstopmode tests/smoke/strict-fail.tex >/dev/null 2>&1; then
            echo "strict-fail compiled in strict mode; the check is broken"
            exit 1
          fi
          grep -q "Serif body text must be at least" strict-fail.log
          latexmk -C tests/smoke/strict-fail.tex >/dev/null 2>&1
          rm -f strict-fail.*
          sed 's/\[phd,font=termes,10pt/[phd,font=termes,strict=false,10pt/' \
            tests/smoke/strict-fail.tex > tests/smoke/strict-warn.tex
          latexmk -pdf -interaction=nonstopmode tests/smoke/strict-warn.tex
          grep -q "Warning: Serif body text" strict-warn.log
          latexmk -C tests/smoke/strict-warn.tex >/dev/null 2>&1
          rm -f strict-warn.* tests/smoke/strict-warn.tex
      - name: Compile option coverage fixtures
        run: |
          status=0
          latexmk -pdf -interaction=nonstopmode tests/smoke/degree-coverage.tex || status=1
          if grep -E "^!" degree-coverage.log; then status=1; fi
          expected=18
          found=$(grep -c "DEGREECHECK:" degree-coverage.log)
          [ "$found" -eq "$expected" ] || { echo "degree markers: $found of $expected"; status=1; }
          grep -q "DEGREECHECK:phd:thesis" degree-coverage.log || status=1
          grep -q "DEGREECHECK:msc:dissertation" degree-coverage.log || status=1
          for f in opt-welsh opt-bonum opt-override opt-templateversion; do
            latexmk -pdf -interaction=nonstopmode "tests/smoke/$f.tex" || status=1
            if grep -E "^!" "$f.log"; then status=1; fi
          done
          grep -q "OVERRIDECHECK:dissertation" opt-override.log || status=1
          if ! tr "\n" " " < opt-templateversion.log | grep -q "template v9.9.9"; then
            echo "template version missing from stamp"
            status=1
          fi
          exit $status
      - name: Compile table and abbreviation fixture
        run: |
          status=0
          latexmk -pdf -interaction=nonstopmode tests/smoke/tables-glossary.tex || status=1
          if grep -E "^!" tables-glossary.log; then status=1; fi
          if grep -E "Unknown abbreviation|multiply defined" tables-glossary.log; then status=1; fi
          text=$(pdftotext -layout tables-glossary.pdf -)
          if ! printf '%s\n' "$text" | grep -q "Machine learning (ML)"; then
            echo "first-use expansion missing from the abbreviations output"
            status=1
          fi
          repeats=$(printf '%s\n' "$text" | grep -cE "Item +Description +Value" || true)
          if [ "$repeats" -lt 2 ]; then
            echo "the longtable header did not repeat on a continuation page"
            status=1
          fi
          exit $status
      - name: Compile layout fixtures and assert header and footer content
        run: |
          status=0
          for f in layout-default layout-options header-short; do
            latexmk -pdf -interaction=nonstopmode "tests/smoke/$f.tex" || status=1
            if grep -E "^!" "$f.log"; then status=1; fi
            if grep -E "Reference .* undefined|multiply defined" "$f.log"; then status=1; fi
          done
          python3 tests/smoke/check-header-alignment.py layout-default.pdf Introduction section || status=1
          python3 tests/smoke/check-header-alignment.py layout-options.pdf Introduction Page || status=1
          text=$(pdftotext -layout layout-default.pdf -)
          if ! printf '%s\n' "$text" | grep -qE "1\. Introduction +1\.2\. Second section"; then
            echo "default header layout missing: chapter left and section right"
            status=1
          fi
          if ! printf '%s\n' "$text" | grep -q "A Reasonably Sized Thesis Title"; then
            echo "the footer does not fall back to the full title"
            status=1
          fi
          last=$(pdfinfo layout-options.pdf | awk '/^Pages:/ {print $2}')
          tail_text=$(pdftotext -f "$last" -l "$last" -layout layout-options.pdf -)
          pageofm=$(printf '%s\n' "$tail_text" | grep -oE "Page [0-9]+ of [0-9]+" | head -1)
          if ! printf '%s\n' "$pageofm" | awk '{ exit !($2 == $4) }'; then
            echo "the last page should read Page N of N, found: ${pageofm:-nothing}"
            status=1
          fi
          if ! printf '%s\n' "$tail_text" | grep -q "Short Title"; then
            echo "the short title is missing from the footer"
            status=1
          fi
          if ! pdftotext -layout header-short.pdf - | grep -qE "2\. Methods +2\.1\. Only section"; then
            echo "the kernel short title did not reach the running header"
            status=1
          fi
          exit $status
      - name: Assert header and footer overflow fail in strict mode and truncate otherwise
        run: |
          status=0
          for spec in "header-fail:too wide for the running header" "footer-fail:too wide for the footer"; do
            f="${spec%%:*}"
            msg="${spec#*:}"
            if latexmk -pdf -interaction=nonstopmode "tests/smoke/$f.tex" >/dev/null 2>&1; then
              echo "$f compiled in strict mode; the check is broken"
              status=1
            elif ! tr -d '\n' < "$f.log" | grep -q "$msg"; then
              echo "$f failed without the expected message: $msg"
              status=1
            fi
            latexmk -C "tests/smoke/$f.tex" >/dev/null 2>&1
            sed 's/\[phd,/[phd,strict=false,/' "tests/smoke/$f.tex" > "tests/smoke/$f-warn.tex"
            if ! latexmk -pdf -interaction=nonstopmode "tests/smoke/$f-warn.tex" >/dev/null 2>&1; then
              echo "$f did not compile with strict=false"
              status=1
            fi
            if ! tr -d '\n' < "$f-warn.log" | grep -q "Warning: .*$msg"; then
              echo "$f-warn compiled without the expected warning: $msg"
              status=1
            fi
            if ! pdftotext -layout "$f-warn.pdf" - | grep -q "\. \. \."; then
              echo "$f-warn was not truncated with an ellipsis"
              status=1
            fi
            latexmk -C "tests/smoke/$f-warn.tex" >/dev/null 2>&1
            rm -f "tests/smoke/$f-warn.tex" "$f-warn".*
          done
          exit $status
      - name: Fetch l3build for the regression checks
        run: |
          curl -sL -o l3build.zip \
            https://mirror.apps.cam.ac.uk/pub/tex-archive/macros/latex/contrib/l3build.zip
          unzip -q l3build.zip
          mkdir -p "$HOME/texmf/scripts/l3build"
          cp l3build/*.lua "$HOME/texmf/scripts/l3build/"
          mktexlsr "$HOME/texmf"
      - name: Run l3build regression checks
        run: texlua l3build/l3build.lua check
      - name: Assert margin-floor violation
        run: |
          if latexmk -pdf -interaction=nonstopmode tests/smoke/margin-fail.tex >/dev/null 2>&1; then
            echo "margin-fail compiled in strict mode; the check is broken"
            exit 1
          fi
          grep -q "binding-edge margin must be at least" margin-fail.log
          latexmk -C tests/smoke/margin-fail.tex >/dev/null 2>&1
          rm -f margin-fail.*
      - name: Assert line-spacing violation
        run: |
          if latexmk -pdf -interaction=nonstopmode tests/smoke/spacing-fail.tex >/dev/null 2>&1; then
            echo "spacing-fail compiled in strict mode; the check is broken"
            exit 1
          fi
          grep -q "main text must use 1.5" spacing-fail.log
          latexmk -C tests/smoke/spacing-fail.tex >/dev/null 2>&1
          rm -f spacing-fail.*
      - name: Assert unknown-font violation
        run: |
          if latexmk -pdf -interaction=nonstopmode tests/smoke/font-fail.tex >/dev/null 2>&1; then
            echo "font-fail compiled in strict mode; the check is broken"
            exit 1
          fi
          grep -q "Unknown font choice" font-fail.log
          latexmk -C tests/smoke/font-fail.tex >/dev/null 2>&1
          rm -f font-fail.*
      - name: Assert abstract length check
        run: |
          python3 - << 'EOF'
          body = "word " * 620
          doc = ("\\documentclass[phd,12pt,a4paper]{bangorthesis}\n"
                 "\\title{Long Abstract Test}\n\\author{E. Student}\n"
                 "\\degreescheme{Doctor of Philosophy}\n\\begin{document}\n"
                 "\\begin{abstract}\n" + body + "\n\\end{abstract}\n"
                 "\\end{document}\n")
          with open("tests/smoke/long-abstract.tex", "w") as fh:
              fh.write(doc)
          EOF
          if latexmk -pdf -interaction=nonstopmode tests/smoke/long-abstract.tex >/dev/null 2>&1; then
            echo "long-abstract compiled in strict mode; the check is broken"
            exit 1
          fi
          grep -q "abstract is approximately" long-abstract.log
          grep -q "caps the abstract at 600 words" long-abstract.log
          latexmk -C tests/smoke/long-abstract.tex >/dev/null 2>&1
          rm -f long-abstract.* tests/smoke/long-abstract.tex

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Mearman/actions/.github/actions/setup-texlive@setup-texlive-v1
        with:
          profile: full
          extra: curl
      - name: Fetch l3build from CTAN
        run: |
          curl -sL -o l3build.zip https://mirror.apps.cam.ac.uk/pub/tex-archive/macros/latex/contrib/l3build.zip
          unzip -q l3build.zip
          mkdir -p "$HOME/texmf/scripts/l3build"
          cp l3build/*.lua "$HOME/texmf/scripts/l3build/"
          mktexlsr "$HOME/texmf"
      - name: Build CTAN archive
        run: texlua l3build/l3build.lua ctan
      - name: Validate archive contents
        run: |
          status=0
          for f in bangor.sty bangoridentity.sty bangorlayout.sty \
                   bangordeclarations.sty bangorletter.sty bangorthesis.cls \
                   bangor-crest-colour.pdf README.md LICENSE; do
            if ! unzip -l bangor-ctan.zip | grep -q "$f"; then
              echo "missing from archive: $f"
              status=1
            fi
          done
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: ctan-archive
          path: bangor-ctan.zip
