name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-commitlint-v1
      - name: Check commit messages
        run: |
          RANGE="${{ github.event.before }}..HEAD"
          if [ "$RANGE" = "0000000000000000000000000000000000000000..HEAD" ]; then
            RANGE="HEAD"
          fi
          npx --yes @commitlint/cli@19 --from "$(git rev-list --max-parents=0 HEAD | tail -1)" --to HEAD

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-lint-v1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-extra-utils chktex yamllint
      - name: Format check
        run: |
          status=0
          for f in *.sty *.cls doc/*.tex tests/smoke/*.tex; do
            latexindent -check -l .latexindent.yaml -s "$f" || status=1
          done
          exit $status
      - name: Lint
        run: |
          status=0
          for f in *.sty *.cls doc/*.tex; do
            chktex -q "$f" 2>&1 | tee "/tmp/chktex-$f.log" || true
            grep -q "Error" "/tmp/chktex-$f.log" && status=1
          done
          exit $status
      - name: Lint workflow YAML
        run: yamllint .github/workflows/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-texlive-v1
      - name: Cache LaTeX build state
        uses: actions/cache@v4
        with:
          path: |
            *.aux
            *.fdb_latexmk
            *.fls
            *.bcf
            *.bbl
          key: latex-build-${{ hashFiles('**/*.tex', '**/*.sty', '**/*.cls', 'tests/smoke/*.bib') }}
          restore-keys: |
            latex-build-
      - name: Install TeX Live and biber
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-bibtex-extra texlive-extra-utils biber latexmk
      - name: Compile documentation
        run: |
          latexmk -pdf -interaction=nonstopmode doc/bangor.tex
          ! grep -E "^!" doc/bangor.log
          ! grep -E "Reference .* undefined|Citation .* undefined|multiply defined" doc/bangor.log
      - name: Compile positive smoke tests
        run: |
          status=0
          for f in research-thesis taught-dissertation letter declarations-article; do
            latexmk -pdf -interaction=nonstopmode "tests/smoke/$f.tex" || status=1
            log="tests/smoke/$f.log"
            grep -E "^!" "$log" && status=1
            grep -E "Reference .* undefined|Citation .* undefined|multiply defined" "$log" && status=1
          done
          exit $status
      - name: Assert strict-mode failure
        run: |
          if latexmk -pdf -interaction=nonstopmode tests/smoke/strict-fail.tex >/dev/null 2>&1; then
            echo "strict-fail compiled in strict mode; the check is broken"
            exit 1
          fi
          grep -q "Serif body text must be at least" strict-fail.log
          latexmk -C tests/smoke/strict-fail.tex >/dev/null 2>&1
          rm -f strict-fail.*
          sed 's/\[phd,font=termes,10pt/[phd,font=termes,strict=false,10pt/' \
            tests/smoke/strict-fail.tex > tests/smoke/strict-warn.tex
          latexmk -pdf -interaction=nonstopmode tests/smoke/strict-warn.tex
          grep -q "Warning: Serif body text" strict-warn.log
          latexmk -C tests/smoke/strict-warn.tex >/dev/null 2>&1
          rm -f strict-warn.* tests/smoke/strict-warn.tex
      - name: Assert abstract length check
        run: |
          python3 - << 'EOF'
          body = "word " * 620
          doc = ("\\documentclass[phd,12pt,a4paper]{bangorthesis}\n"
                 "\\title{Long Abstract Test}\n\\author{E. Student}\n"
                 "\\degreeScheme{Doctor of Philosophy}\n\\begin{document}\n"
                 "\\begin{abstract}\n" + body + "\n\\end{abstract}\n"
                 "\\end{document}\n")
          with open("tests/smoke/long-abstract.tex", "w") as fh:
              fh.write(doc)
          EOF
          if latexmk -pdf -interaction=nonstopmode tests/smoke/long-abstract.tex >/dev/null 2>&1; then
            echo "long-abstract compiled in strict mode; the check is broken"
            exit 1
          fi
          grep -q "abstract is approximately" long-abstract.log
          grep -q "caps the abstract at 600 words" long-abstract.log
          latexmk -C tests/smoke/long-abstract.tex >/dev/null 2>&1
          rm -f long-abstract.* tests/smoke/long-abstract.tex

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-extra-utils
      - name: Fetch l3build from CTAN
        run: |
          curl -sL -o l3build.zip https://mirror.apps.cam.ac.uk/pub/tex-archive/macros/latex/contrib/l3build.zip
          unzip -q l3build.zip
          mkdir -p "$HOME/texmf/scripts/l3build"
          cp l3build/*.lua "$HOME/texmf/scripts/l3build/"
          mktexlsr "$HOME/texmf"
      - name: Build CTAN archive
        run: texlua l3build/l3build.lua ctan
      - uses: actions/upload-artifact@v4
        with:
          name: ctan-archive
          path: bangor-ctan.zip
