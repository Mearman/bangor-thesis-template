name: Format

# One-click source formatting for contributors without a local
# TeX Live: runs latexindent with the committed settings over every
# LaTeX source and lands the result as a single conventional commit,
# then starts CI so the lint job sees the formatted tree.
on: workflow_dispatch

permissions:
  contents: write
  actions: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Mearman/actions/.github/actions/setup-texlive@setup-texlive-v1
        with:
          profile: lint
      - name: Format
        run: |
          for f in *.sty *.cls doc/*.tex tests/smoke/*.tex; do
            latexindent -l .latexindent.yaml -s -w "$f" && rm -f "$f.bak0"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -- '*.sty' '*.cls' doc tests/smoke
            git commit -m "style: run latexindent over the sources"
            remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push "$remote" "HEAD:${GITHUB_REF_NAME}"
            # A push made with the workflow token does not start other workflows, so CI is started explicitly.
            gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          else
            echo "already formatted"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
